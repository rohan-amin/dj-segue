[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dj-segue"
version = "0.1.0"
description = "AI-driven DJ system for wordplay transitions between songs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "rohan" }]
dependencies = [
    "pydantic>=2.0,<3",
    "typer>=0.12",
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "numba>=0.59",  # the filter lane's per-sample filter (librosa needs it too)
    "sounddevice>=0.4",
]

[project.optional-dependencies]
# Downbeat detection (beat 0 = a bar's "1"). Pulls in PyTorch; M3 stems need it too.
downbeats = [
    "beat_this>=1.1",
]
# Stem separation (M3): vocals / drums / bass / other. Uses the PyTorch that
# beat_this pulls in; the model weights (~300 MB) download on first use.
stems = [
    "demucs>=4.0",
]
# Word timing (M6): lyrics from LRCLIB aligned to the vocals stem (torchaudio's
# wav2vec2, from the PyTorch above; needs `stems`), checked against a Whisper
# transcription. Whisper's weights (~1.6 GB) download on first use.
words = [
    "faster-whisper>=1.1",
    "mutagen>=1.47",
    "pronouncing>=0.2",  # CMU pronouncing dictionary: rhymes and sound-alikes (the finder)
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dj-segue = "dj_segue.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dj_segue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
